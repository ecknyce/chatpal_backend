databases:
  - name: chatpal_storage
    plan: free
    databaseName: chatpal_db
    user: ecky

services:
  - type: web
    plan: free
    name: chatpal
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'daphne -b 0.0.0.0 -p $PORT chatcom.asgi:application'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatpal_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4